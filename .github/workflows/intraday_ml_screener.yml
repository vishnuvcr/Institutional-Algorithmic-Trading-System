name: Universal NSE ML Screener

on:
  workflow_dispatch: # Manual 1-click execution
  schedule:
    # Runs Monday to Friday at 09:30 AM IST (04:00 UTC) and 01:30 PM IST (08:00 UTC)
    - cron: '0 4 * * 1-5'
    - cron: '0 8 * * 1-5'

jobs:
  run-universal-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute Universal ML Engine
        run: python intraday_ml_pipeline.py

      - name: Upload Universal Pine Script v6 Strategy
        uses: actions/upload-artifact@v4
        with:
          name: universal-pine-script-v6
          path: strategy_v6.pine
          retention-days: 7

      - name: Upload Master Ranked CSV
        uses: actions/upload-artifact@v4
        with:
          name: final-ranked-results-csv
          path: final_ranked_results.csv
          retention-days: 7
